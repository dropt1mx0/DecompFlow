<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" shape-rendering="crispEdges">
  <!-- Antennas / Ears -->
  <rect x="5" y="4" width="2" height="2" fill="#f97316" />
  <rect x="15" y="4" width="2" height="2" fill="#f97316" />
  
  <!-- Head Top -->
  <rect x="7" y="6" width="8" height="2" fill="#f97316" />
  
  <!-- Face Row 1 -->
  <rect x="4" y="8" width="14" height="2" fill="#f97316" />
  
  <!-- Face Row 2 with Eyes -->
  <rect x="3" y="10" width="16" height="2" fill="#f97316" />
  <!-- Eye cutouts -->
  <rect x="6" y="10" width="2" height="2" fill="#0f1013" />
  <rect x="14" y="10" width="2" height="2" fill="#0f1013" />
  
  <!-- Face Row 3 -->
  <rect x="3" y="12" width="16" height="2" fill="#f97316" />
  <!-- Mouth/detail cutout -->
  <rect x="9" y="12" width="4" height="1" fill="#0f1013" />
  
  <!-- Body Main -->
  <rect x="4" y="14" width="14" height="3" fill="#f97316" />
  
  <!-- Legs / Feet -->
  <rect x="5" y="17" width="3" height="3" fill="#f97316" />
  <rect x="14" y="17" width="3" height="3" fill="#f97316" />
  <rect x="9" y="16" width="4" height="1" fill="#f97316" />

  <!-- Magic Wand / Sparkle on right -->
  <rect x="19" y="7" width="1" height="6" fill="#fb923c" />
  <rect x="20" y="5" width="2" height="2" fill="#facc15" />
  <rect x="19" y="4" width="1" height="1" fill="#fef08a" />
  <rect x="22" y="6" width="1" height="1" fill="#fef08a" />
</svg>
