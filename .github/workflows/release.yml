name: Build & Release Desktop Installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Core package first (Crucial for workspaces)
        run: npm run build --workspace=@decompflow/core

      - name: Build Desktop package
        run: npm run build --workspace=@decompflow/desktop

      - name: Package Linux (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop

      - name: Package Windows (.exe NSIS & Portable)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop

      - name: Package macOS (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        working-directory: packages/desktop
